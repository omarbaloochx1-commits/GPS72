name: Build GPS 72 APK

on:
  workflow_dispatch:
  push:
    paths:
      - 'GPS72-GitHub-Build-Pack-2.zip'
      - '.github/workflows/android.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Extract build package
        run: |
          unzip -q GPS72-GitHub-Build-Pack-2.zip
          unzip -q gps72-github-pack/GPS72-android-v2-fixed.zip

      - name: Build APK
        run: gradle -p GPS72 assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GPS72-debug-APK
          path: GPS72/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
